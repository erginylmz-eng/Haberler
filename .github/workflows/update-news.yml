name: Haberleri Güncelle

on:
  schedule:
    # Her 4 saatte bir çalışır (UTC). İhtiyaca göre değiştirilebilir.
    - cron: '0 */4 * * *'
  workflow_dispatch: {} # Actions sekmesinden manuel tetikleme için

permissions:
  contents: write
  actions: write # siteyi yayınlama workflow'unu tetikleyebilmek için

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    # Güvenlik ağı: AI API çağrısı beklenmedik şekilde askıda kalırsa
    # (bkz. scripts/fetch-news.mjs içindeki withTimeout), job GitHub'ın
    # varsayılan 6 saatlik timeout'unu beklemeden burada durdurulur —
    # concurrency grubu da bu sayede uzun süre kilitli kalmaz.
    timeout-minutes: 20
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Bağımlılıkları yükle
        run: npm ci

      - name: Haberleri çek ve özetle
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: npm run fetch-news

      - name: Değişiklik varsa commit'le, gönder ve siteyi yeniden yayınla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "movus-haber-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- data/news.json; then
            echo "Değişiklik yok, commit atlanıyor."
          else
            git add data/news.json
            git commit -m "chore: haberleri otomatik güncelle"
            git push
            # ÖNEMLİ: GITHUB_TOKEN ile yapılan bir push, GitHub'ın sonsuz
            # döngüyü önleme kuralı gereği başka workflow'ları OTOMATİK
            # tetiklemez. Bu yüzden "Siteyi Yayınla" workflow'unu burada
            # elle (API üzerinden) tetikliyoruz — aksi halde haberler
            # güncellenir ama site eski haliyle kalırdı.
            gh workflow run deploy-pages.yml --ref main
          fi
