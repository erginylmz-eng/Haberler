name: Siteyi Yayınla (GitHub Pages)

# Kod değiştiğinde (push) ya da haber güncelleme iş akışı data/news.json'u
# otomatik commit'lediğinde bu iş akışı da tetiklenir ve siteyi GitHub
# Pages'te yeniden yayınlar. Tamamen ücretsizdir; GitHub Pages'in
# Netlify/Vercel gibi bir "kredi" ya da fatura sistemi yoktur.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Bağımlılıkları yükle
        run: npm ci

      - name: Siteyi statik olarak derle
        run: npm run build

      - name: GitHub Pages'i yapılandır
        uses: actions/configure-pages@v5

      - name: Derlenen siteyi paketle
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages'e yayınla
        id: deployment
        uses: actions/deploy-pages@v4
